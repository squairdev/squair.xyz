<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>squair.xyz > 404</title>
    <style>
body {
  margin: 0;
  color: #fff;
  font-family: Arial, sans-serif;
  overflow: hidden;
}
nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 2rem;
  padding: 1rem 0;
  z-index: 10;
}
nav a {
  color: #fff;
  text-decoration: none;
  position: relative;
  font-size: 1.1rem;
}
nav a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -4px;
  width: 100%;
  height: 2px;
  background: #00ffff;
  opacity: 0;
  transform: translateY(5px);
  transition: all 0.3s ease;
}
nav a:hover::after {
  opacity: 1;
  transform: translateY(0);
}
main {
  max-width: 900px;
  margin: 6rem auto 4rem auto;
  text-align: center;
}
h1 {
  font-size: 3rem;
  color: #00ffff;
}
p {
  font-size: 1.2rem;
  line-height: 1.6;
  color: #ddd;
}
#overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  backdrop-filter: blur(8px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: oklch(70.7% 0.165 254.624);
  font-family: monospace;
  font-size: 2rem;
  z-index: 9999;
}
#overlay.ready {
  cursor: pointer;
}
#subtext {
  margin-top: 1rem;
  font-size: 1rem;
  color: #aaa;
}
.hidden, .sub {
  display: none;
  text-align: center;
}
#blob {
  position: fixed;
  top: 0;
  left: 0;
  width: 34vmax;
  height: 34vmax;
  pointer-events: none;
  z-index: -1;
  transform: translate3d(var(--x, 50vw), var(--y, 50vh), 0) translate(-50%, -50%);
  will-change: transform;
}

#blob .blob-inner {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: linear-gradient(
    to right,
    oklch(24.012% 0.04066 236.549),
    oklch(28.2% 0.091 267.935)
  );
  opacity: 0.8;
  overflow: hidden;
  animation: rotate 20s infinite linear;
}

#blur {
  position: fixed;
  inset: 0;
  z-index: -1;
  backdrop-filter: blur(12vmax);
  overflow: hidden;
}
</style>
</head>
<body class="bg-slate-950">
    <div id="blob"><div class="blob-inner"></div></div><div id="blur"></div>
    <div id="overlay"><span id="typed"></span><div id="subtext" class="sub">I don't know <span id="path"></span></div></div>
    <script>
    const blob = document.getElementById("blob");
    let x = window.innerWidth / 2;
    let y = window.innerHeight / 2;
    let targetX = x;
    let targetY = y;
    window.addEventListener("pointermove", (e) => {
      targetX = e.clientX;
      targetY = e.clientY;
    });
    function tick() {
      const ease = 0.04; 
      x += (targetX - x) * ease;
      y += (targetY - y) * ease;

      blob.style.setProperty("--x", x + "px");
      blob.style.setProperty("--y", y + "px");

      requestAnimationFrame(tick);
    }
    tick();
    window.addEventListener("resize", () => {
      if (!Number.isFinite(targetX) || !Number.isFinite(targetY)) {
        targetX = window.innerWidth / 2;
        targetY = window.innerHeight / 2;
      }
    });
    const overlay = document.getElementById('overlay');
    const typed = document.getElementById('typed');
    const subtext = document.getElementById('subtext');
    let text = "Squair > 404";
    let i = 0;
    function typeEffect() {
      if (i < text.length) {
        typed.textContent += text.charAt(i);
        i++;
        setTimeout(typeEffect, 50);
      } else {
        subtext.classList.remove('hidden');
        subtext.classList.remove('sub');
        overlay.classList.add('ready');
        overlay.addEventListener('click', enterSite);
      }
    }
    function enterSite() {
      history.back()
    }
    typeEffect();

    let path = window.location.pathname + ".";
    if (path == "/404/." || path == "/404.") {
        path = "that path. Wait, how did you even get here?"
    }
    const pathtxt = document.getElementById("path").innerHTML = path
    </script>
</body>
</html>
